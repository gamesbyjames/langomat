<!DOCTYPE html>
<html>
<head>
    <title>ElevenLabs Audio Cache Generator</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            max-width: 1000px; 
            margin: 0 auto; 
            padding: 20px; 
        }
        .controls { 
            background: #f8f9fa; 
            padding: 20px; 
            border-radius: 8px; 
            margin-bottom: 20px; 
        }
        .phrase-item { 
            margin: 10px 0; 
            padding: 15px; 
            border: 1px solid #ddd; 
            border-radius: 5px; 
            background: white;
        }
        .phrase-item.processing { background-color: #fff3cd; }
        .phrase-item.success { background-color: #d4edda; }
        .phrase-item.error { background-color: #f8d7da; }
        
        button { 
            padding: 10px 20px; 
            margin: 5px; 
            background: #007bff; 
            color: white; 
            border: none; 
            border-radius: 5px; 
            cursor: pointer; 
        }
        button:disabled { 
            background: #6c757d; 
            cursor: not-allowed; 
        }
        
        input, select { 
            width: 100%; 
            padding: 8px; 
            margin: 5px 0; 
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        
        .stats { 
            background: #e9ecef; 
            padding: 15px; 
            border-radius: 5px; 
            margin: 10px 0; 
        }
        
        .progress { 
            width: 100%; 
            height: 20px; 
            background: #e9ecef; 
            border-radius: 10px; 
            overflow: hidden; 
        }
        
        .progress-bar { 
            height: 100%; 
            background: #28a745; 
            transition: width 0.3s ease; 
        }
        
        .download-link { 
            display: inline-block; 
            margin: 5px; 
            padding: 5px 10px; 
            background: #17a2b8; 
            color: white; 
            text-decoration: none; 
            border-radius: 3px; 
        }
        
        pre { 
            background: #f8f9fa; 
            padding: 10px; 
            border-radius: 5px; 
            overflow-x: auto; 
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <h1>ElevenLabs Audio Cache Generator</h1>
    
    <div class="controls">
        <h3>Configuration</h3>
        
        <label for="apiKey">ElevenLabs API Key:</label>
        <input type="text" id="apiKey" placeholder="Enter your ElevenLabs API key..." />
        
        <label for="language">Language:</label>
        <select id="language">
            <option value="tr-TR">Turkish</option>
            <option value="de-DE">German</option>
            <option value="fr-FR">French</option>
            <option value="es-ES">Spanish</option>
            <option value="pt-PT">Portuguese</option>
            <option value="it-IT">Italian</option>
            <option value="el-GR">Greek</option>
            <option value="en-US">English</option>
            <option value="ru-RU">Russian</option>
            <option value="hi-IN">Hindi</option>
            <option value="ar-AR">Arabic</option>
            <option value="fa-IR">Farsi</option>
            <option value="ja-JP">Japanese</option>
        </select>
        
        <label for="section">Section:</label>
        <select id="section">
            <option value="">Select a section...</option>
        </select>
        
        <div style="margin: 15px 0;">
            <button onclick="loadPhrases()">Load Phrases</button>
            <button onclick="generateAllAudio()" id="generateBtn" disabled>Generate All Audio</button>
            <button onclick="downloadAll()" id="downloadBtn" disabled>Download All as ZIP</button>
            <button onclick="clearCache()">Clear Cache</button>
        </div>
        
        <div class="progress">
            <div class="progress-bar" id="progressBar" style="width: 0%"></div>
        </div>
        <div id="progressText">Ready to generate audio files</div>
    </div>
    
    <div class="stats" id="stats" style="display: none;">
        <h4>Cache Statistics</h4>
        <div id="statsContent"></div>
    </div>
    
    <div id="phrases"></div>
    
    <div id="downloadLinks" style="display: none;">
        <h3>Download Individual Files</h3>
        <div id="linksList"></div>
    </div>

    <script>
        const VOICE_IDS = {
            "de-DE": "EXAVITQu4vr4xnSDxMaL",
            "tr-TR": "pNInz6obpgDQGcFmaJgB",
            "fr-FR": "ErXwobaYiN019PkySvjV",
            "pt-PT": "ErXwobaYiN019PkySvjV",
            "it-IT": "ThT5KcBeYPX3keUQqHPh",
            "en-US": "21m00Tcm4TlvDq8ikWAM",
            "es-ES": "ThT5KcBeYPX3keUQqHPh",
            "el-GR": "ThT5KcBeYPX3keUQqHPh",
            "ru-RU": "ymDCYd8puC7gYjxIamPt",
            "hi-IN": "Ag50Eld5oCoZVliw70iY",
            "ar-AR": "EXAVITQu4vr4xnSDxMaL",
            "fa-IR": "EXAVITQu4vr4xnSDxMaL",
            "ja-JP": "EXAVITQu4vr4xnSDxMaL"
        };

        const LANGUAGE_NAMES = {
            "de-DE": "German",
            "tr-TR": "Turkish",
            "fr-FR": "French",
            "es-ES": "Spanish",
            "pt-PT": "Portuguese",
            "it-IT": "Italian",
            "el-GR": "Greek",
            "en-US": "English",
            "ru-RU": "Russian",
            "hi-IN": "Hindi",
            "ar-AR": "Arabic",
            "fa-IR": "Farsi",
            "ja-JP": "Japanese"
        };

        let allSections = {};
        let audioCache = {};
        let totalSize = 0;

        // Load and parse phrases from the selected language file
        async function loadPhrases() {
            const language = document.getElementById('language').value;
            const sectionSelect = document.getElementById('section');
            
            try {
                const fileMap = {
                    "de-DE": "german_phrases.txt",
                    "tr-TR": "phrases.txt",
                    "fr-FR": "french_phrases.txt",
                    "es-ES": "spanish_phrases.txt",
                    "pt-PT": "portuguese_phrases.txt",
                    "it-IT": "italian_phrases.txt",
                    "el-GR": "greek_phrases.txt",
                    "en-US": "english_phrases.txt",
                    "ru-RU": "russian_phrases.txt",
                    "hi-IN": "hindi_phrases.txt",
                    "ar-AR": "arabic_phrases.txt",
                    "fa-IR": "farsi_phrases.txt",
                    "ja-JP": "japanese_phrases.txt"
                };
                
                const fileName = fileMap[language];
                console.log('Trying to load file:', fileName);
                
                const response = await fetch(fileName);
                console.log('Response status:', response.status, response.statusText);
                
                if (!response.ok) {
                    throw new Error(`Failed to load ${fileName}: ${response.status} ${response.statusText}`);
                }
                
                const text = await response.text();
                console.log('File content length:', text.length);
                
                allSections = parsePhrases(text);
                console.log('Parsed sections:', Object.keys(allSections));
                
                // Populate section dropdown
                sectionSelect.innerHTML = '<option value="">Select a section...</option>';
                Object.keys(allSections).forEach(section => {
                    const option = document.createElement('option');
                    option.value = section;
                    option.textContent = section;
                    sectionSelect.appendChild(option);
                });
                
                document.getElementById('generateBtn').disabled = false;
                alert(`Loaded ${Object.keys(allSections).length} sections for ${LANGUAGE_NAMES[language]}`);
                
            } catch (error) {
                alert('Error loading phrases: ' + error.message);
            }
        }

        function parsePhrases(text) {
            const sections = {};
            let current = null;
            text.split("\n").forEach((raw) => {
                const line = raw.trim();
                if (!line || line.startsWith("//")) return;
                if (line.startsWith("#")) {
                    current = line.replace(/^#/, "").replace(/:\s*$/, "").trim();
                    if (!sections[current]) sections[current] = [];
                    return;
                }
                if (!current) return;
                const bar = line.split("|");
                if (bar.length < 2) return;
                const foreign = bar[0].trim();
                const right = bar.slice(1).join("|").trim();
                let translation = right;
                let hint = null;
                const idx = right.indexOf(":");
                if (idx !== -1) {
                    translation = right.slice(0, idx).trim();
                    hint = right.slice(idx + 1).trim();
                }
                sections[current].push({
                    words: foreign.split(/\s+/).filter(Boolean),
                    translation,
                    hint
                });
            });
            return sections;
        }

        async function generateSpeech(text, lang) {
            const apiKey = document.getElementById('apiKey').value.trim();
            if (!apiKey) {
                throw new Error('API key required');
            }
            
            const voiceId = VOICE_IDS[lang];
            if (!voiceId) {
                throw new Error(`No voice ID for language ${lang}`);
            }
            
            const speedByLang = { "ar-AR": 0.8 };
            
            const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${voiceId}`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "xi-api-key": apiKey,
                },
                body: JSON.stringify({
                    text,
                    model_id: "eleven_multilingual_v2",
                    voice_settings: {
                        stability: 0.4,
                        similarity_boost: 0.8,
                        speed: speedByLang[lang] ?? 1,
                    },
                }),
            });
            
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            }
            
            return await response.blob();
        }

        async function generateAllAudio() {
            const language = document.getElementById('language').value;
            const sectionName = document.getElementById('section').value;
            
            if (!sectionName) {
                alert('Please select a section');
                return;
            }
            
            const phrases = allSections[sectionName];
            if (!phrases) {
                alert('No phrases found for selected section');
                return;
            }
            
            const phrasesDiv = document.getElementById('phrases');
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');
            const generateBtn = document.getElementById('generateBtn');
            
            phrasesDiv.innerHTML = '';
            audioCache = {};
            totalSize = 0;
            
            generateBtn.disabled = true;
            
            let completed = 0;
            const total = phrases.length;
            
            progressText.textContent = `Generating audio for ${total} phrases...`;
            
            for (let i = 0; i < phrases.length; i++) {
                const phrase = phrases[i];
                const sentence = phrase.words.join(' ');
                const filename = `${sectionName}_${i + 1}_${sanitizeFilename(sentence)}.mp3`;
                
                const phraseDiv = document.createElement('div');
                phraseDiv.className = 'phrase-item processing';
                phraseDiv.innerHTML = `
                    <strong>Phrase ${i + 1}:</strong> ${sentence}<br>
                    <strong>Translation:</strong> ${phrase.translation}<br>
                    <strong>Status:</strong> <span id="status-${i}">Generating...</span>
                `;
                phrasesDiv.appendChild(phraseDiv);
                
                try {
                    // Add delay to avoid rate limiting
                    if (i > 0) {
                        await new Promise(resolve => setTimeout(resolve, 1000)); // 1 second delay
                    }
                    
                    const audioBlob = await generateSpeech(sentence, language);
                    const audioUrl = URL.createObjectURL(audioBlob);
                    
                    audioCache[filename] = {
                        blob: audioBlob,
                        url: audioUrl,
                        sentence: sentence,
                        translation: phrase.translation,
                        size: audioBlob.size
                    };
                    
                    totalSize += audioBlob.size;
                    
                    phraseDiv.className = 'phrase-item success';
                    document.getElementById(`status-${i}`).innerHTML = `
                        ✅ Generated (${formatFileSize(audioBlob.size)})
                        <audio controls style="margin-left: 10px; width: 200px;">
                            <source src="${audioUrl}" type="audio/mpeg">
                        </audio>
                    `;
                    
                } catch (error) {
                    phraseDiv.className = 'phrase-item error';
                    document.getElementById(`status-${i}`).textContent = `❌ Error: ${error.message}`;
                }
                
                completed++;
                const progress = (completed / total) * 100;
                progressBar.style.width = `${progress}%`;
                progressText.textContent = `Generated ${completed}/${total} audio files`;
            }
            
            // Show statistics
            updateStats();
            generateBtn.disabled = false;
            document.getElementById('downloadBtn').disabled = false;
            document.getElementById('downloadLinks').style.display = 'block';
            generateDownloadLinks();
            
            progressText.textContent = `✅ Complete! Generated ${Object.keys(audioCache).length} audio files`;
        }

        function updateStats() {
            const statsDiv = document.getElementById('stats');
            const statsContent = document.getElementById('statsContent');
            
            const fileCount = Object.keys(audioCache).length;
            const totalSizeMB = totalSize / (1024 * 1024);
            const avgSizeKB = fileCount > 0 ? (totalSize / fileCount) / 1024 : 0;
            
            statsContent.innerHTML = `
                <p><strong>Total Files:</strong> ${fileCount}</p>
                <p><strong>Total Size:</strong> ${formatFileSize(totalSize)} (${totalSizeMB.toFixed(2)} MB)</p>
                <p><strong>Average File Size:</strong> ${avgSizeKB.toFixed(1)} KB</p>
                <p><strong>Estimated Storage:</strong> ${(totalSizeMB * 1.1).toFixed(2)} MB (with 10% overhead)</p>
            `;
            
            statsDiv.style.display = 'block';
        }

        function generateDownloadLinks() {
            const linksList = document.getElementById('linksList');
            linksList.innerHTML = '';
            
            Object.entries(audioCache).forEach(([filename, data]) => {
                const link = document.createElement('a');
                link.href = data.url;
                link.download = filename;
                link.className = 'download-link';
                link.textContent = `${filename} (${formatFileSize(data.size)})`;
                linksList.appendChild(link);
            });
        }

        async function downloadAll() {
            if (Object.keys(audioCache).length === 0) {
                alert('No audio files to download');
                return;
            }
            
            // Note: This creates individual downloads since ZIP creation requires additional libraries
            // For a proper ZIP file, you'd need to include JSZip library
            alert(`Starting download of ${Object.keys(audioCache).length} files. Check your downloads folder.`);
            
            Object.entries(audioCache).forEach(([filename, data]) => {
                const link = document.createElement('a');
                link.href = data.url;
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            });
        }

        function clearCache() {
            audioCache = {};
            totalSize = 0;
            document.getElementById('phrases').innerHTML = '';
            document.getElementById('stats').style.display = 'none';
            document.getElementById('downloadLinks').style.display = 'none';
            document.getElementById('progressBar').style.width = '0%';
            document.getElementById('progressText').textContent = 'Ready to generate audio files';
            document.getElementById('downloadBtn').disabled = true;
        }

        function sanitizeFilename(text) {
            return text.replace(/[^a-z0-9]/gi, '_').toLowerCase().substring(0, 50);
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            // Auto-load Turkish phrases
            document.getElementById('language').value = 'tr-TR';
            loadPhrases();
        });
    </script>
</body>
</html>
